name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, tokenizer, json
          coverage: none

      - name: Install analysis tools
        run: bash scripts/setup.sh

      - name: Tests
        run: bash tests/run.sh
        env:
          # The --php=docker test pulls php:8.5.12-cli: once is enough.
          PHP_UPGRADE_AUDIT_TEST_DOCKER: ${{ matrix.php == '8.5' && 'auto' || '0' }}

      - name: Audit the sample project (smoke test, all tools)
        run: |
          php scripts/audit.php fixtures/legacy-app --out="$RUNNER_TEMP/store" --name=legacy-app --load-classes --offline
          php scripts/render.php --store="$RUNNER_TEMP/store" --out="$RUNNER_TEMP/store/report.html" --offline
