ParentClassNoArgsRector":1,"AddEscapeArgumentRector":1,"ExplicitNullableParamTypeRector":1,"ShellExecFunctionCallOverBackticksRector":1,"ColonAfterSwitchCaseRector":1,"RemoveFuncCallRector":1,"RenameCastRector":1,"RenameClassConstFetchRector":1,"ExplicitPublicClassMethodRector":1}},"status":{"level":"wajib","label":"Not ready: 3 compile errors, removed functions"},"summary":"src/Legacy.php does not compile on PHP 8: three removed constructs stop it (php -l only shows the first one). After that, three removed features (PHP 4 constructor, each(), mysql_*) and the mcrypt extension must be replaced, and four libraries are abandoned or far behind. Roughly 1-2 days of work plus testing.","notes":[{"sev":"wajib","title":"The file does not compile: 3 removed constructs","body":"The curly brace string offset ($name{0}), the (real) cast and __autoload() were removed in PHP 8.0. Each one stops compilation, and php -l reports only the first per file, so fix all three before re-scanning (the scanner lists every one).","files":["src/Legacy.php:16","src/Legacy.php:69","src/Legacy.php:44"],"code":[{"where":"src/Legacy.php:16","before":"$first = $name{0};","after":"$first = $name[0];"},{"where":"src/Legacy.php:69","before":"$f = (real) $n;","after":"$f = (float) $n;"},{"where":"src/Legacy.php:44","before":"function __autoload($c) {}","after":"spl_autoload_register(function ($c) {});","note":"With all three changed, php -l on 8.5.12 reports no syntax error.","proof":{"php":"8.5.12","run":"php -l src/Legacy.php (after all three changes)","output":"No syntax errors detected in src/Legacy.php"}}],"evidence":[{"kind":"php.net","title":"PHP 8.0 migration: backward incompatible changes","url":"https://www.php.net/manual/en/migration80.incompatible.php","quote":"Support for deprecated curly braces for offset access has been removed. The (real) and (unset) casts have been removed. The ability to specify an autoloader using an __autoload() function has been removed."}]},{"sev":"wajib","title":"PHP 4 style constructor no longer runs","body":"Since PHP 8.0 a method with the class name is an ordinary method, so Legacy::Legacy() is never called and $declared stays null. Rename it to __construct(). Also declare $undeclared (dynamic property, deprecated since 8.2).","files":["src/Legacy.php:7"],"code":[{"where":"src/Legacy.php:7-11","before":"function Legacy()\n{\n    $this-\u003Edeclared = 1;\n    $this-\u003Eundeclared = 2;\n}","after":"public $undeclared;\n\npublic function __construct()\n{\n    $this-\u003Edeclared = 1;\n    $this-\u003Eundeclared = 2;\n}","note":"Checked on 8.5.12: the property is set, no deprecation.","proof":{"php":"8.5.12","run":"php ctor.php (the suggested class, then var_dump((new Legacy())-\u003Edeclared))","output":"int(1)"}}],"evidence":[{"kind":"php.net","title":"PHP 8.0 migration: backward incompatible changes","url":"https://www.php.net/manual/en/migration80.incompatible.php","quote":"Methods with the same name as the class are no longer interpreted as constructors."}]},{"sev":"wajib","title":"each() was removed","body":"each() is gone since PHP 8.0 (fatal: undefined function). For a single call, read the current element and advance the pointer; for loops, use foreach.","files":["src/Legacy.php:54"],"code":[{"where":"src/Legacy.php:54","before":"$r = each($arr);","after":"$key = key($arr);\n$r = $key === null ? false : [1 =\u003E $arr[$key], 'value' =\u003E $arr[$key], 0 =\u003E $key, 'key' =\u003E $key];\nnext($arr);","note":"Gives exactly what each() returned on PHP 7.4, and moves the pointer the same way.","proof":{"php":"8.5.12","run":"php each.php (same array on 7.4.33 with each() gives the identical array)","output":"replacement: {\"1\":1,\"value\":1,\"0\":\"a\",\"key\":\"a\"} next key: b"}}],"evidence":[{"kind":"php.net","title":"PHP 8.0 migration: backward incompatible changes","url":"https://www.php.net/manual/en/migration80.incompatible.php","quote":"each() has been removed."}]},{"sev":"perilaku","title":"Concatenation and + changed precedence","body":"Since PHP 8.0, + and - bind tighter than the dot. \"Total: \" . $n + 1 printed 1 on PHP 7.4 (with a warning) and prints \"Total: 6\" on 8.x. Add parentheses so the intent is explicit on every version.","files":["src/Legacy.php:19"],"code":[{"where":"src/Legacy.php:19","before":"echo \"Total: \" . $n + 1;","after":"echo \"Total: \" . ($n + 1);","note":"Prints \"Total: 6\" on 7.4 and 8.5.12.","proof":{"php":"8.5.12","run":"php concat.php (7.4.33: the current code prints 1, the suggested one Total: 6)","output":"Total: 6"}}],"evidence":[{"kind":"php.net","title":"PHP 8.0 migration: backward incompatible changes","url":"https://www.php.net/manual/en/migration80.incompatible.php","quote":"The precedence of the concatenation operator has changed relative to bitshifts and addition as well as subtraction."},{"kind":"rfc","title":"RFC: Change the precedence of the concatenation operator","url":"https://wiki.php.net/rfc/concatenation_precedence"}]},{"sev":"perilaku","title":"password_hash() gets slower: bcrypt cost 10 -\u003E 12","body":"PHP 8.4 raised the default bcrypt cost from 10 to 12. Hashing takes about 4x longer, and password_needs_rehash() now says every existing cost-10 hash needs a rehash, so logins rewrite them. Check the load on login and sign-up; keep cost 10 explicitly only if the extra time is not acceptable.","files":["src/Legacy.php:73"],"code":[{"where":"src/Legacy.php:73","before":"$hash = password_hash($n, PASSWORD_DEFAULT);","after":"$hash = password_hash($n, PASSWORD_DEFAULT); // cost 12 from PHP 8.4; ['cost' =\u003E 10] keeps the old speed","note":"No code change needed unless the slower hashing is a problem.","proof":{"php":"8.5.12","run":"php bcrypt.php (8.3.36: $2y$10$ in ~60 ms, needs_rehash false)","output":"$2y$12$ (cost 12), time 239 ms, needs_rehash(cost 10 hash) = true"}}],"evidence":[{"kind":"php-src","title":"PHP 8.4 UPGRADING: bcrypt cost","url":"https://github.com/php/php-src/blob/PHP-8.4/UPGRADING","qu   const T = I18N[LANG];
  const SEV_ORDER = ['wajib', 'deprecated', 'perilaku', 'info'];
  const LIB_CLASS = { 'aman': 's-ok', 'perlu-upgrade': 's-deprecated', 'tidak-didukung': 's-wajib', 'cek-manual': 's-perilaku' };
  const LEVEL_CLASS = { wajib: 's-wajib', deprecated: 's-deprecated', perilaku: 's-perilaku', ok: 's-ok', info: 's-info' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pill = (sev, text) => `<span class="pill s-${esc(sev)}">${esc(text || (T.sev[sev] ? T.sev[sev][0] : sev))}</span>`;
  const locale = LANG === 'id' ? 'id-ID' : 'en-GB';
  const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(locale, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso; } };
  const scanDate = (v) => fmtDate(v.generated_at || '');
  const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  const num = (n) => Number(n || 0).toLocaleString(locale);

  // ---------- data model: entities with versions (oldest → newest)
  const entities = DATA.entities || [];
  const repos = entities.filter((e) => e.kind === 'repo');
  const compares = entities.filter((e) => e.kind === 'compare' && !e.hidden);
  const visibleRepos = repos.filter((e) => !e.hidden);
  const latest = (e) => e.versions[e.versions.length - 1];
  const byName = (n) => entities.find((e) => e.name === n);
  const overview = DATA.overview || {};
  const target = (visibleRepos[0] && latest(visibleRepos[0]).target) || (repos[0] && latest(repos[0]).target) || '';

  function analyse(r) {
    const scan = r.scan || {};
    const rules = scan.rules || {};
    const counts = { wajib: 0, deprecated: 0, perilaku: 0, info: 0 };
    const guarded = { wajib: 0, deprecated: 0, perilaku: 0, info: 0 };
    for (const f of scan.findings || []) {
      const sev = (rules[f.rule] || {}).sev || 'info';
      (f.guarded ? guarded : counts)[sev]++;
    }
    const libs = { 'aman': 0, 'perlu-upgrade': 0, 'tidak-didukung': 0, 'cek-manual': 0 };
    for (const p of ((r.libs || {}).packages || [])) libs[p.status] = (libs[p.status] || 0) + 1;
    const lintErr = ((r.lint || {}).errors || []).length;
    const lintDep = ((r.lint || {}).deprecations || []).length;
    const removedExt = ((r.libs || {}).extensions || []).filter((e) => e.removed_in).length;
    const loadFail = ((r.runtime || {}).failed || []).length;
    let status = ['s-ok', T.autoStatus.ok];
    if (counts.wajib || lintErr || libs['tidak-didukung'] || removedExt || loadFail) status = ['s-wajib', T.autoStatus.must];
    else if (counts.deprecated || counts.perilaku || libs['perlu-upgrade'] || libs['cek-manual'] || lintDep) status = ['s-deprecated', T.autoStatus.dep];
    if (r.status && r.status.label) status = [LEVEL_CLASS[r.status.level] || 's-info', r.status.label];
    return { counts, guarded, libs, lintErr, lintDep, status };
  }
  const compareStatus = (c) => c.status && c.status.label ? [LEVEL_CLASS[c.status.level] || 's-info', c.status.label] : ['s-info', T.comparisons];

  /** Live (not guarded-dead) findings keyed by rule|file|code so line shifts do not count as changes. */
  function findingKeys(v) {
    const set = new Map();
    for (const f of ((v.scan || {}).findings || [])) {
      if (f.guarded) continue;
      const k = f.rule + '|' + f.file + '|' + String(f.code || '').replace(/\s+/g, ' ').trim();
      set.set(k, (set.get(k) || 0) + 1);
    }
    return set;
  }
  function delta(prev, cur) {
    const a = findingKeys(prev), b = findingKeys(cur);
    let resolved = 0, added = 0, same = 0;
    for (const [k, n] of a) { const m = b.get(k) || 0; resolved += Math.max(0, n - m); same += Math.min(n, m); }
    for (const [k, n] of b) { added += Math.max(0, n - (a.get(k) || 0)); }
    return { resolved, added, same };
  }

  // ---------- pages and routing:  #overview  |  #<entity>  |  #<entity>~<scan-id>
  const pages = [{ id: 'overview', label: T.overview, render: renderOverview }];
  visibleRepos.forEach((e) => pages.push({ id: slug(e.name), entity: e, label: e.name, cls: analyse(latest(e)).status[0], render: (v) => renderRepo(e, v) }));
  compares.forEach((e) => pages.push({ id: slug(e.name), entity: e, label: e.name, cmp: true, cls: compareStatus(latest(e))[0], render: (v) => renderCompare(e, v) }));
  const ALIASES = { ringkasan: 'overview' };

  function parseHash() {
    let raw = decodeURIComponent(location.hash.slice(1));
    let [id, ver] = raw.split('~');
    id = ALIASES[id] || id;
    const page = pages.find((p) => p.id === id) || pages[0];
    let version = null;
    if (page.entity) {
      version = page.entity.versions.find((v) => v.scan_id === ver) || latest(page.entity);
    }
    return { page, version };
  }
  const token = (page, version) => page.entity && version && version !== latest(page.entity) ? `${page.id}~${version.scan_id}` : page.id;

  document.getElementById('menuBtn').setAttribute('aria-label', T.menu);
  document.getElementById('sidebar').setAttribute('aria-label', T.menuLabel);
  document.getElementById('top-ver').textContent = `PHP 7.x → ${target}`;
  document.getElementById('page-meta').innerHTML = [
    `<span>${esc(T.target)} <b>PHP ${esc(target)}</b></span>`,
    `<span>${esc(T.generated)} <b>${esc(fmtDate(DATA.generated_at))}</b></span>`
  ].join('');
  const navItem = (p) => `<li><a href="#${esc(p.id)}" data-page="${esc(p.id)}">${esc(p.label)}${p.entity && p.entity.versions.length > 1 ? ` <span class="cnt">×${p.entity.versions.length}</span>` : ''}${p.cls ? `<span class="dot ${p.cls}" aria-hidden="true"></span>` : ''}</a></li>`;
  const grp = (title, items) => items.length ? `<div class="d-grp"><div class="d-grp-t">${esc(title)}</div><ul class="d-nav">${items.map(navItem).join('')}</ul></div>` : '';
  document.getElementById('nav').innerHTML = grp(T.grpReport, pages.filter((p) => !p.entity)) + grp(T.grpRepos, pages.filter((p) => p.entity && !p.cmp)) + grp(T.grpCompare, pages.filter((p) => p.cmp));

  const menuBtn = document.getElementById('menuBtn');
  const setNav = (open) => { document.body.classList.toggle('nav-open', open); menuBtn.setAttribute('aria-expanded', String(open)); };
  menuBtn.addEventListener('click', () => setNav(!document.body.classList.contains('nav-open')));
  document.getElementById('scrim').addEventListener('click', () => setNav(false));
  document.getElementById('nav').addEventListener('click', (e) => { if (e.target.closest('a')) setNav(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setNav(false); });

  const host = document.getElementById('pages');
  const rendered = {};
  function show() {
    const { page, version } = parseHash();
    const key = page.id + '~' + (version ? version.scan_id : '');
    if (!rendered[key]) {
      const el = document.createElement('div');
      el.className = 'page';
      el.innerHTML = linkBar(page, version) + (page.entity ? versionBar(page, version) : '') + page.render(version);
      host.appendChild(el);
      rendered[key] = el;
      if (page.entity && !page.cmp) wireFindings(el, version);
      const sel = el.querySelector('[data-role="version"]');
      if (sel) sel.addEventListener('change', () => { const v = page.entity.versions.find((x) => x.scan_id === sel.value); location.hash = token(page, v); });
    }
    Object.entries(rendered).forEach(([k, el]) => { el.hidden = k !== key; });
    document.querySelectorAll('#nav a').forEach((a) => { if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const active = [...document.querySelectorAll('#nav a')].find((a) => a.dataset.page === page.id);
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
  }
  window.addEventListener('hashchange', () => { show(); window.scrollTo(0, 0); });

  // ---------- link bar + version bar
  const pageLink = (tok) => (DATA.url ? DATA.url.replace(/#.*$/, '') : location.href.split('#')[0]) + '#' + tok;
  function linkBar(page, version) {
    const tok = token(page, version);
    return `<div class="linkbar"><span class="mono">#${esc(tok)}</span>
      <button type="button" class="chip" data-copy="${esc(tok)}">${esc(T.copyLink)}</button>
      <input type="text" readonly class="linkfield" aria-label="Link" hidden></div>`;
  }
  host.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    const link = pageLink(b.dataset.copy);
    const field = b.parentElement.querySelector('.linkfield');
    field.value = link;
    const fallback = () => { field.hidden = false; field.focus(); field.select(); b.textContent = T.copyManual; };
    try {
      navigator.clipboard.writeText(link).then(() => { b.textContent = T.copied; setTimeout(() => { b.textContent = T.copyLink; }, 2000); }, fallback);
    } catch (err) { fallback(); }
  });
  function versionBar(page, version) {
    const vs = page.entity.versions;
    const idx = vs.indexOf(version);
    const isLatest = idx === vs.length - 1;
    const opts = vs.slice().reverse().map((v) => `<option value="${esc(v.scan_id)}"${v === version ? ' selected' : ''}>${esc(scanDate(v))}${v === latest(page.entity) ? ' · ' + esc(T.latest) : ''}</option>`).join('');
    let d = '';
    if (!page.cmp) {
      if (idx > 0) {
        const x = delta(vs[idx - 1], version);
        d = `<span class="delta">${esc(T.vsPrev)} (${esc(scanDate(vs[idx - 1]))}): <span class="pill s-ok">${x.resolved} ${esc(T.resolved)}</span> <span class="pill s-wajib">${x.added} ${esc(T.added)}</span> <span class="pill s-info">${x.same} ${esc(T.unchanged)}</span></span>`;
      } else {
        d = `<span class="delta">${esc(T.firstScan)}</span>`;
      }
    }
    return `<div class="verbar"><label>${esc(T.version)} <select data-role="version" aria-label="${esc(T.version)}">${opts}</select></label>
      <span class="sub">${vs.length} ${esc(T.scans)}</span>
      ${isLatest ? '' : `<span class="old">${esc(T.olderView)}</span> <a href="#${esc(page.id)}">${esc(T.toLatest)}</a>`}
      ${d}</div>
      ${version.carried_from ? `<div class="banner">${esc(T.carried(scanDate(vs.find((v) => v.scan_id === version.carried_from) || { generated_at: version.carried_from })))}</div>` : ''}`;
  }

  // ---------- overview
  function renderOverview() {
    const goal = overview.goal;
    const rows = visibleRepos.map((e) => {
      const v = latest(e), a = analyse(v), fw = (v.profile || {}).framework;
      return `<tr><td><a href="#${esc(slug(e.name))}">${esc(e.name)}</a></td><td><span class="pill ${a.status[0]}">${esc(a.status[1])}</span></td>
        <td>${fw ? esc(fw.name + ' ' + (fw.version || '')) : '<span class="sub">-</span>'}</td>
        <td class="num">${a.counts.wajib}</td><td class="num">${a.counts.deprecated}</td><td class="num">${a.counts.perilaku}</td><td class="num">${a.lintErr}</td>
        <td>${esc(scanDate(v))}<div class="sub">${e.versions.length} ${esc(T.scans)}</div></td></tr>`;
    }).join('');
    return `
      ${dashboardHtml()}
      ${goal ? `<section><h2>${esc(goal.title || T.goal)}</h2>
        <p class="lead">${esc(goal.text || '')}</p>
        ${(goal.points || []).length ? `<ul class="checklist">${goal.points.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${(goal.scope || []).length ? `<dl class="profile">${goal.scope.map((x) => `<dt>${esc(x.k)}</dt><dd>${esc(x.v)}</dd>`).join('')}</dl>` : ''}</section>` : ''}
      ${overview.summary ? `<section><h2>${esc(T.conclusion)}</h2><div class="summary"><p>${esc(overview.summary)}</p></div></section>` : ''}
      ${(overview.steps || []).length ? `<section><h2>${esc(T.steps)}</h2><ol class="steps">${overview.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></section>` : ''}
      ${compares.length ? `<section><h2>${esc(T.comparisons)}</h2><div class="cards">${compares.map((e) => { const c = latest(e), st = compareStatus(c); return `<a class="card" href="#${esc(slug(e.name))}"><h3>${esc(e.name)}</h3><span><span class="pill ${st[0]}">${esc(st[1])}</span></span><p class="sub">${esc((c.old || {}).path)} → ${esc((c.new || {}).path)} · ${esc((c.app || {}).path)}</p></a>`; }).join('')}</div></section>` : ''}
      <section>
        <h2>${esc(T.perRepo)}</h2><p class="lead">${esc(T.perRepoLead(target))}</p>
        <div class="legend">${SEV_ORDER.map((s) => `<span>${pill(s)} ${esc(T.sev[s][1])}</span>`).join('')}</div>
        <div class="table-scroll"><table><thead><tr><th>${esc(T.repo)}</th><th>${esc(T.status)}</th><th>${esc(T.framework)}</th><th class="num">${esc(T.sev.wajib[0])}</th><th class="num">${esc(T.sev.deprecated[0])}</th><th class="num">${esc(T.sev.perilaku[0])}</th><th class="num">php -l</th><th>${esc(T.lastScan)}</th></tr></thead><tbody>${rows}</tbody></table></div>
      </section>
      ${(overview.notes || []).length ? `<section><h2>${esc(T.crossNotes)}</h2>${notesHtml(overview.notes)}</section>` : ''}
      <section><h2>${esc(T.runtimeTitle)}</h2><p class="lead">${esc(T.runtimeLead(target))}</p><ul class="checklist">${T.runtime.map((x) => `<li>${x}</li>`).join('')}</ul></section>
      <section><h2>${esc(T.methodTitle)}</h2><ul class="checklist">${T.methodList.map((x) => `<li>${x}</li>`).join('')}</ul></section>`;
  }

  function dashboardHtml() {
    const all = visibleRepos.map((e) => ({ e, v: latest(e), a: analyse(latest(e)) }));
    const sum = (f) => all.reduce((n, x) => n + f(x), 0);
    const files = sum((x) => (x.v.profile || {}).php_files || 0);
    const lines = sum((x) => (x.v.profile || {}).php_lines || 0);
    const pkgs = sum((x) => ((x.v.libs || {}).packages || []).length);
    const toCheck = sum((x) => x.a.libs['tidak-didukung'] + x.a.libs['perlu-upgrade'] + x.a.libs['cek-manual']);
    const blockers = [].concat(...all.map((x) => (x.v.notes || []).filter((n) => n.sev === 'wajib').map((n) => ({ repo: x.e.name, title: n.title }))));
    const maxFind = Math.max(1, ...all.map((x) => x.a.counts.wajib + x.a.counts.deprecated + x.a.counts.perilaku));
    const bar = (a) => ['wajib', 'deprecated', 'perilaku'].map((k) => a.counts[k] ? `<span class="seg ${k}" style="flex:${a.counts[k]}" title="${esc(T.sev[k][0])}: ${a.counts[k]}"></span>` : '').join('');
    const noLint = all.every((x) => x.a.lintErr === 0);
    const conflicts = compares.length ? (((latest(compares[0]).overrides || {}).new) || []).length : '-';
    return `<section>
      <h2>${esc(T.dashboard)}</h2>
      <div class="stats">
        <div class="stat"><span class="v">${visibleRepos.length}</span><span class="k">${esc(T.reposAudited)}</span></div>
        <div class="stat"><span class="v">${num(files)}</span><span class="k">${esc(T.phpFiles)} · ${num(lines)} ${esc(T.lines)}</span></div>
        <div class="stat ${blockers.length ? 'wajib' : 'ok'}"><span class="v">${blockers.length}</span><span class="k">${esc(T.mustItems)}</span></div>
        <div class="stat deprecated"><span class="v">${sum((x) => x.a.counts.deprecated)}</span><span class="k">${esc(T.depInCode)}</span></div>
        <div class="stat perilaku"><span class="v">${sum((x) => x.a.counts.perilaku)}</span><span class="k">${esc(T.behInCode)}</span></div>
        <div class="stat ${noLint ? 'ok' : 'wajib'}"><span class="v">${sum((x) => x.a.lintErr)}</span><span class="k">${esc(T.lintErr(target))}</span></div>
        <div class="stat"><span class="v">${pkgs}</span><span class="k">${esc(T.pkgs)} · ${toCheck} ${esc(T.pkgCheck)}</span></div>
        ${compares.length ? `<div class="stat"><span class="v">${conflicts}</span><span class="k">${esc(T.overrideConf)}</span></div>` : ''}
        <div class="stat ok"><span class="v">${(DATA.privacy || {}).leftover || 0}</span><span class="k">${esc(T.privCard)}</span></div>
      </div>
      <p class="lead priv"><b>${esc(T.privTitle)}.</b> ${esc(T.privLead((DATA.privacy || {}).redacted || 0))}</p>
      <div class="table-scroll"><table class="dash"><thead><tr><th>${esc(T.repo)}</th><th>${esc(T.status)}</th><th>${esc(T.distribution)}</th><th class="num">${esc(T.packages)}</th></tr></thead><tbody>
        ${all.map(({ e, v, a }) => { const n = a.counts.wajib + a.counts.deprecated + a.counts.perilaku;
          return `<tr><td><a href="#${esc(slug(e.name))}">${esc(e.name)}</a></td><td><span class="pill ${a.status[0]}">${esc(a.status[1])}</span></td>
          <td><div class="bar" style="width:${Math.max(8, Math.round(n / maxFind * 100))}%">${bar(a) || '<span class="seg none"></span>'}</div><div class="sub">${a.counts.wajib} ${esc(T.sev.wajib[0].toLowerCase())} · ${a.counts.deprecated} deprecated · ${a.counts.perilaku} ${esc(T.sev.perilaku[0].toLowerCase())}</div></td>
          <td class="num">${((v.libs || {}).packages || []).length}</td></tr>`; }).join('')}
      </tbody></table></div>
      ${blockers.length ? `<div><h3>${esc(T.mustList)}</h3><ul class="checklist">${blockers.map((b) => `<li><a href="#${esc(slug(b.repo))}">${esc(b.repo)}</a>: ${esc(b.title)}</li>`).join('')}</ul></div>` : ''}
    </section>`;
  }

  /** Only http(s) links: notes are written from audited code, so never trust a scheme such as javascript:. */
  const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\/[^\s]+$/i.test(u) ? u : null);
  function evidenceHtml(list, label) {
    if (!Array.isArray(list) || !list.length) return '';
    return `<div class="evidence"><div class="codelabel">${esc(label || T.evidence)}</div><ul>` + list.map((ev) => {
      const e = typeof ev === 'string' ? { url: ev } : (ev || {});
      const url = safeUrl(e.url);
      const title = e.title || e.url || '';
      let host = '';
      try { host = url ? new URL(url).host : ''; } catch (x) { host = ''; }
      const kind = e.kind ? `<span class="tag">${esc((T.evKind || {})[e.kind] || e.kind)}</span> ` : '';
      const link = url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>${host && title !== url ? ` <span class="sub mono">${esc(host)}</span>` : ''}`
        : `${esc(title)}${e.url ? ` <span class="sub">(${esc(T.unsafeLink)})</span>` : ''}`;
      return `<li>${kind}${link}${e.quote ? `<q>${esc(e.quote)}</q>` : ''}</li>`;
    }).join('') + '</ul></div>';
  }
  function notesHtml(notes) {
    if (!notes || !notes.length) return '';
    return `<div class="notes">` + notes.map((n) =>
      `<div class="note"><div class="note-head">${pill(n.sev || 'info')}<h3>${esc(n.title)}</h3></div><p>${esc(n.body)}</p>${n.files ? `<div class="files">${n.files.map((f) => `<span class="tag mono">${esc(f)}</span>`).join('')}</div>` : ''}${codeHtml(n.code)}${evidenceHtml(n.evidence)}</div>`
    ).join('') + `</div>`;
  }
  function codeHtml(list) {
    if (!list || !list.length) return '';
    return list.map((c) => `<div class="codecmp">
      ${c.where ? `<div class="codewhere mono">${esc(c.where)}</div>` : ''}
      <div class="codegrid">
        <div class="codecol"><div class="codelabel before">${esc(T.current)}</div><pre class="code">${esc(c.before || '')}</pre></div>
        <div class="codecol"><div class="codelabel after">${esc(T.suggested)}</div><pre class="code">${esc(c.after || '')}</pre></div>
      </div>
      ${c.note ? `<p class="sub">${esc(c.note)}</p>` : ''}
      ${c.proof && typeof c.proof === 'object' ? `<details class="proof"><summary>${esc(T.proofOn(c.proof.php || '?', c.proof.run || ''))}</summary>${c.proof.output ? `<pre class="code">${esc(c.proof.output)}</pre>` : ''}</details>` : ''}
    </div>`).join('');
  }

  // ---------- repo page
  function renderRepo(e, r) {
    const a = analyse(r);
    const p = r.profile || {};
    const git = p.git ? `${esc(p.git.branch || '')} @ <span class="mono">${esc(p.git.commit || '')}</span> (${esc(p.git.date || '')})` : esc(T.notGit);
    const hints = (p.php_hints || []).map((h) => `<div><span class="mono">${esc(h.value)}</span> <span class="sub">${esc(T.fromSrc)} ${esc(h.source)}</span></div>`).join('') || `<span class="sub">${esc(T.none)}</span>`;
    const bundled = (p.bundled || []).map((b) => `<div><span class="mono">${esc(b.path)}/</span> ${b.kind === 'composer'
      ? b.packages.slice(0, 12).map((x) => `<span class="tag mono">${esc(x.name)} ${esc(x.version || '')}</span>`).join('') + (b.packages.length > 12 ? ` <span class="sub">+${b.packages.length - 12}</span>` : '')
      : `<span class="tag">${esc(b.kind)}</span>${b.name ? ` <span class="mono">${esc(b.name)} ${esc(b.version || '')}</span>` : ''}`}</div>`).join('');
    const wp = p.wordpress ? `<div>${esc(T.wpHeader(p.wordpress.type, p.wordpress.name, p.wordpress.version, p.wordpress.requires_php))}</div>` : '';
    const tp = wp + bundled + (p.third_party_dirs || []).map((d) => `<div><span class="mono">${esc(d.dir)}/</span> ${d.entries.slice(0, 12).map((x) => `<span class="tag">${esc(x)}</span>`).join('')}${d.entries.length > 12 ? ` <span class="sub">+${d.entries.length - 12}</span>` : ''}</div>`).join('') || `<span class="sub">${esc(T.none)}</span>`;
    const mini = p.minified_files || [];
    const t = r.target || target;
    return `
      <div class="page-head"><h2>${esc(e.name)}</h2><span class="pill ${a.status[0]}">${esc(a.status[1])}</span></div>
      ${r.summary ? `<div class="summary"><p>${esc(r.summary)}</p></div>` : ''}
      <div class="stats">
        <div class="stat wajib"><span class="v">${a.counts.wajib}</span><span class="k">${esc(T.mustScanner)}${a.guarded.wajib ? ` · +${a.guarded.wajib} ${esc(T.deadOn(t))}` : ''}</span></div>
        <div class="stat deprecated"><span class="v">${a.counts.deprecated}</span><span class="k">Deprecated${a.guarded.deprecated ? ` · +${a.guarded.deprecated} ${esc(T.deadOn(t))}` : ''}</span></div>
        <div class="stat perilaku"><span class="v">${a.counts.perilaku}</span><span class="k">${esc(T.sev.perilaku[0])}</span></div>
        <div class="stat"><span class="v">${a.lintErr}</span><span class="k">${esc(T.lintStat)}</span></div>
        <div class="stat"><span class="v">${((r.libs || {}).packages || []).length}</span><span class="k">${esc(T.pkgStat)}</span></div>
      </div>
      ${(r.notes || []).length ? `<section><h3>${esc(T.analystNotes)}</h3>${notesHtml(r.notes)}</section>` : ''}
      <section><h3>${esc(T.profile)}</h3>
      <dl class="profile">
        <dt>${esc(T.fw)}</dt><dd>${p.framework ? esc(p.framework.name + ' ' + (p.framework.version || '')) + ` <span class="sub">(${esc(p.framework.source)})</span>` : esc(T.notDetected)}</dd>
        <dt>${esc(T.phpHints)}</dt><dd>${hints}</dd>
        <dt>${esc(T.code)}</dt><dd>${num(p.php_files)} ${esc(T.phpFiles)} · ${num(p.php_lines)} ${esc(T.lines)}</dd>
        <dt>${esc(T.minified)}</dt><dd>${mini.length ? esc(T.minifiedTxt(mini.length)) : esc(T.none)}</dd>
        <dt>${esc(T.thirdParty)}</dt><dd>${tp}</dd>
        <dt>${esc(T.git)}</dt><dd>${git}</dd>
      </dl></section>
      <section><h3>${esc(T.libTitle)}</h3>${libRootHtml(r.libs)}${libTableHtml(r.libs)}${libNotesHtml(r.libs)}${extHtml(r.libs)}</section>
      <section>
        <h3>${esc(T.findings)}</h3><p class="lead">${T.findingsLead}</p>
        <div class="toolbar">
          ${SEV_ORDER.map((s) => `<button type="button" class="chip" aria-pressed="true" data-sev="${s}">${esc(T.sev[s][0])}</button>`).join('')}
          <label><input type="checkbox" data-role="guarded"> ${esc(T.showGuarded(t))}</label>
          <input type="search" data-role="q" placeholder="${esc(T.search)}" aria-label="${esc(T.search)}">
        </div>
        <div class="table-scroll"><table data-role="findings"></table></div>
      </section>
      ${lintHtml(r.lint)}${runtimeHtml(r.runtime)}${phpcompatHtml(r.phpcompat)}${rectorHtml(r.rector)}`;
  }

  function libRootHtml(libs) {
    if (!libs || !libs.composer) return `<p class="lead">${esc((libs && (libs.packages || []).length) ? T.noComposerBundled : T.noComposer)}</p>`;
    const root = libs.root || {};
    const parts = [`<code>require.php</code> = <span class="mono">${esc(root.php || T.notSet)}</span>${root.allows_target === false ? ' ' + pill('wajib', T.notAllow(libs.target)) : ''}`];
    if (root.platform_php) parts.push(`<code>config.platform.php</code> = <span class="mono">${esc(root.platform_php)}</span> ${pill('wajib', T.mustChange(libs.target))}`);
    if (!root.has_lock) parts.push(pill('perilaku', T.noLock));
    return `<p class="lead">${parts.join(' · ')}</p>`;
  }
  function libTableHtml(libs) {
    if (!libs || (!libs.composer && !(libs.packages || []).length)) return '';
    const order = { 'tidak-didukung': 0, 'perlu-upgrade': 1, 'cek-manual': 2, 'aman': 3 };
    const rows = (libs.packages || []).slice().sort((x, y) => (order[x.status] - order[y.status]) || x.name.localeCompare(y.name));
    if (!rows.length) return `<p class="empty">${esc(T.noPkgs)}</p>`;
    const sug = (s) => s ? `<span class="mono">${esc(s.version)}</span><div class="sub">php ${esc(s.php || '-')}${s.released ? ' · ' + esc(s.released) : ''}</div>` : '<span class="sub">-</span>';
    return `<div class="table-scroll"><table><thead><tr><th>${esc(T.pkg)}</th><th>${esc(T.installed)}</th><th>PHP</th><th>${esc(T.status)}</th><th>${esc(T.latestSame)}</th><th>${esc(T.latestCompat(libs.target))}</th><th>${esc(T.notes)}</th></tr></thead><tbody>` +
      rows.map((p) => {
        const s = p.suggest || {};
        const notes = [];
        if (p.abandoned) notes.push(`<span class="tag">${esc(T.abandoned)}${typeof p.abandoned === 'string' ? ': ' + esc(T.replaceWith) + ' ' + esc(p.abandoned) : ''}</span>`);
        (p.risk || []).forEach((x) => notes.push(`<span class="tag">${esc(x)}</span>`));
        if (p.dev) notes.push(`<span class="tag">${esc(T.dev)}</span>`);
        if (p.bundled_in) notes.push(`<span class="tag">${esc(T.bundledIn(p.bundled_in))}</span>`);
        const L = p.links || {};
        ['packagist', 'source', 'release'].forEach((k) => { if (safeUrl(L[k])) notes.push(`<a class="tag" href="${esc(L[k])}" target="_blank" rel="noopener noreferrer">${esc(T.libLink[k])}</a>`); });
        if ((p.upgrade_notes || []).length) notes.push(`<span class="tag">${esc(T.libNotesCount(p.upgrade_notes.length))}</span>`);
        return `<tr><td class="mono">${esc(p.name)}</td><td class="mono">${esc(p.version || p.constraint || '-')}<div class="sub">${esc(p.released || '')}</div></td>
          <td class="mono">${esc(p.php || '-')}</td><td><span class="pill ${LIB_CLASS[p.status] || 's-info'}">${esc(T.lib[p.status] || p.status)}</span></td>
          <td>${sug(s.latest_same_major)}</td><td>${sug(s.latest_compatible)}</td><td>${notes.join('')}</td></tr>`;
      }).join('') + '</tbody></table></div>';
  }
  function libNotesHtml(libs) {
    const rows = ((libs && libs.packages) || []).flatMap((p) => (p.upgrade_notes || []).map((n) => ({ p, n })));
    if (!rows.length) return '';
    return `<details class="block" open><summary>${esc(T.libNotesTitle(rows.length))}</summary><div class="notes">` + rows.map(({ p, n }) => {
      const [title, body] = n[LANG] || n.en || ['', ''];
      return `<div class="note"><div class="note-head">${pill(n.sev || 'info')}<h3>${esc(title)}</h3></div>
        <p class="sub mono">${esc(T.libNoteWhen(p.name, p.version, n.to))}</p><p>${esc(body)}</p>
        ${n.proof ? `<p class="sub"><b>${esc(T.provenBy)}:</b> ${esc(typeof n.proof === 'string' ? n.proof : (n.proof[LANG] || n.proof.en || ''))}</p>` : ''}${evidenceHtml(n.evidence)}</div>`;
    }).join('') + '</div></details>';
  }
  function extHtml(libs) {
    const ex = (libs && libs.extensions) || [];
    if (!ex.length) return '';
    return `<details class="block"${ex.some((e) => e.removed_in) ? ' open' : ''}><summary>${esc(T.extTitle(ex.length))}</summary><div><div class="table-scroll"><table><thead><tr><th>${esc(T.ext)}</th><th>${esc(T.requiredBy)}</th><th>${esc(T.inTarget)}</th></tr></thead><tbody>` +
      ex.map((e) => `<tr><td class="mono">ext-${esc(e.name)}</td><td>${e.required_by.map((b) => `<span class="tag mono">${esc(b)}</span>`).join('')}</td>
        <td>${e.removed_in ? pill('wajib', T.removedSince(e.removed_in)) : pill('ok', T.available)}</td></tr>`).join('') + '</tbody></table></div></div></details>';
  }
  function lintHtml(lint) {
    if (!lint || lint.error) return `<p class="empty">${esc(T.lintFail)}</p>`;
    const errs = lint.errors || [], deps = lint.deprecations || [];
    const list = (items) => `<ul class="hits">${items.map((x) => `<li><span class="loc">${esc(x.file)}:${x.line} · ${esc(x.type)}</span><code>${esc(x.message)}</code></li>`).join('')}</ul>`;
    return `<details class="block"${errs.length ? ' open' : ''}><summary>${esc(T.lintSum(lint.php, errs.length, deps.length, num(lint.files_linted)))}</summary><div>
      ${errs.length ? `<h3>${esc(T.parseErr)}</h3>${list(errs)}` : `<p class="empty">${esc(T.noLintErr)}</p>`}
      ${deps.length ? `<h3>${esc(T.compileDep)}</h3>${list(deps.slice(0, 500))}` : ''}</div></details>`;
  }
  function runtimeHtml(rt) {
    if (!rt || rt.error) return rt && rt.error ? `<details class="block"><summary>${esc(T.rtSum('?', 0, 0, 0, 0, 0))}</summary><div><p class="sub">${esc(rt.error)}</p></div></details>` : '';
    const failed = rt.failed || [], unres = rt.unresolved || [], deps = rt.deprecations || [];
    const mode = (T.rtMode[rt.mode] || rt.mode || '');
    const rows = (items, extra) => `<div class="table-scroll"><table><thead><tr><th>${esc(T.rtUnit)}</th><th>${esc(extra ? T.rtMissing : T.type)}</th><th>${esc(T.rtWhere)}</th></tr></thead><tbody>` +
      items.slice(0, 300).map((x) => `<tr><td class="mono">${esc(x.unit)}</td><td>${extra ? `<span class="mono">${esc(x.missing)}</span>` : esc(x.type)}</td><td><span class="mono">${esc(x.where || x.file || '')}</span><div class="sub">${esc(x.message)}</div></td></tr>`).join('') + '</tbody></table></div>';
    return `<details class="block"${failed.length ? ' open' : ''}><summary>${esc(T.rtSum(rt.php, rt.loaded, rt.units, failed.length, unres.length, deps.length))}</summary><div>
      <p class="sub">${esc(mode)}${rt.install && rt.install.platform_php_ignored ? ' · ' + pill('wajib', T.rtPlatform) : ''}</p>
      ${(rt.notes || []).map((n) => `<p class="sub">${esc(n)}</p>`).join('')}
      ${failed.length ? `<h3>${esc(T.rtFailed)}</h3>${rows(failed, false)}` : ''}
      ${deps.length ? `<h3>${esc(T.rtDeps)}</h3><ul class="hits">${deps.slice(0, 300).map((x) => `<li><span class="loc">${esc(x.where)} · ×${x.count}</span><code>${esc(x.message)}</code></li>`).join('')}</ul>` : ''}
      ${unres.length ? `<h3>${esc(T.rtUnresolved)}</h3>${rows(unres, true)}` : ''}
      ${(rt.library_deprecations || []).length ? `<h3>${esc(T.rtLibDeps)}</h3><ul class="hits">${rt.library_deprecations.slice(0, 100).map((x) => `<li><span class="loc">${esc(x.where)} · ×${x.count}</span><code>${esc(x.message)}</code></li>`).join('')}</ul>` : ''}
      ${(rt.skipped || []).length ? `<p class="sub">${esc(T.rtSkipped(rt.skipped.length))}</p>` : ''}
      ${!rt.units ? `<p class="empty">${esc(T.rtNothing)}</p>` : ''}</div></details>`;
  }
  function phpcompatHtml(pc) {
    if (!pc) return '';
    if (!pc.ok) return `<details class="block"><summary>${esc(T.pcFail)}</summary><div><p class="sub">phpcompat.json</p></div></details>`;
    const by = {};
    for (const m of pc.messages || []) (by[m.source] = by[m.source] || []).push(m);
    const ids = Object.keys(by).sort((a, b) => by[b].length - by[a].length);
    return `<details class="block"><summary>${esc(T.pcSum(pc.testVersion, (pc.messages || []).length, ids.length))}</summary><div>
      ${ids.length ? `<div class="table-scroll"><table><thead><tr><th>${esc(T.sniff)}</th><th>${esc(T.type)}</th><th class="num">${esc(T.count)}</th><th>${esc(T.example)}</th></tr></thead><tbody>` +
      ids.map((id) => { const m = by[id][0]; return `<tr><td class="mono">${esc(id)}</td><td>${esc(m.type)}</td><td class="num">${by[id].length}</td><td><span class="mono">${esc(m.file)}:${m.line}</span><div class="sub">${esc(m.message)}</div></td></tr>`; }).join('') +
      `</tbody></table></div>` : `<p class="empty">${esc(T.noMsg)}</p>`}</div></details>`;
  }
  function rectorHtml(rc) {
    if (!rc) return '';
    if (!rc.ok) return `<details class="block"><summary>${esc(T.rcFail)}</summary><div><p class="sub">rector.json</p></div></details>`;
    const rules = Object.entries(rc.by_rule || {});
    return `<details class="block"><summary>${esc(T.rcSum(rc.set, rc.changed_files))}</summary><div><p class="sub">${esc(T.rcNote)}</p>
      ${rules.length ? `<div class="table-scroll"><table><thead><tr><th>${esc(T.rcRule)}</th><th class="num">${esc(T.files)}</th></tr></thead><tbody>${rules.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>` : `<p class="empty">${esc(T.noChange)}</p>`}</div></details>`;
  }

  function wireFindings(el, r) {
    const table = el.querySelector('[data-role="findings"]');
    if (!table) return;
    const scan = r.scan || {};
    const rules = scan.rules || {};
    const rectorRules = (r.rector && r.rector.by_rule) || {};
    const state = { sev: new Set(SEV_ORDER), guarded: false, q: '' };
    const open = new Set();
    const limits = {};
    function render() {
      const groups = {};
      const q = state.q.toLowerCase();
      for (const f of scan.findings || []) {
        const meta = rules[f.rule] || { sev: 'info', title: f.rule };
        if (!state.sev.has(meta.sev)) continue;
        if (f.guarded && !state.guarded) continue;
        if (q && !(f.file.toLowerCase().includes(q) || (meta.title || '').toLowerCase().includes(q) || f.rule.toLowerCase().includes(q) || (f.code || '').toLowerCase().includes(q))) continue;
        (groups[f.rule] = groups[f.rule] || []).push(f);
      }
      const ids = Object.keys(groups).sort((x, y) => SEV_ORDER.indexOf(rules[x].sev) - SEV_ORDER.indexOf(rules[y].sev) || groups[y].length - groups[x].length);
      if (!ids.length) { table.innerHTML = `<tbody><tr><td class="empty">${esc(T.noFindings)}</td></tr></tbody>`; return; }
      table.innerHTML = `<thead><tr><th>${esc(T.level)}</th><th>${esc(T.since)}</th><th>${esc(T.issue)}</th><th class="num">${esc(T.count)}</th><th>${esc(T.confidence)}</th><th>Rector</th></tr></thead><tbody>` +
        ids.map((id) => {
          const m = rules[id], hits = groups[id];
          const files = new Set(hits.map((h) => h.file)).size;
          const auto = m.rector ? (rectorRules[m.rector] ? T.yes : T.avail) : '-';
          const expanded = open.has(id);
          const limit = limits[id] || 200;
          const detail = !expanded ? '' : `<tr class="detail"><td colspan="6"><ul class="hits">` + hits.slice(0, limit).map((h) =>
            `<li><span class="loc">${esc(h.file)}:${h.line}</span>${h.guard ? `<span class="guard">${esc(T.guardedBy)} <code>${esc(h.guard)}</code>: ${esc(T.guard[h.guard_state] || '')}</span>` : ''}<code>${esc(h.code)}</code></li>`).join('') +
            (hits.length > limit ? `<li><button type="button" class="more" data-more="${esc(id)}">${esc(T.showMore(hits.length - limit))}</button></li>` : '') + `</ul></td></tr>`;
          return `<tr class="rule-row" data-rule="${esc(id)}" tabindex="0" aria-expanded="${expanded}"><td><span class="caret">▸</span> ${pill(m.sev)}</td>
            <td class="mono">${esc(m.ver)}</td>
            <td><div>${esc(m.title)}</div><div class="sub">${esc(m.fix)} ${safeUrl(m.ref) ? `<a href="${esc(m.ref)}" target="_blank" rel="noopener noreferrer">php.net</a>` : ''}${(m.evidence || []).filter((x) => safeUrl(x.url)).map((x) => ` · <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc((T.evKind || {})[x.kind] || x.title || x.kind)}</a>`).join('')} · <span class="mono">${esc(id)}</span></div></td>
            <td class="num">${hits.length}<div class="sub">${files} ${esc(T.files)}</div></td><td>${esc(m.conf)}</td><td>${esc(auto)}</td></tr>${detail}`;
        }).join('') + '</tbody>';
    }
    table.addEventListener('click', (ev) => {
      const more = ev.target.closest('[data-more]');
      if (more) { limits[more.dataset.more] = Infinity; render(); return; }
      if (ev.target.closest('a')) return;
      const row = ev.target.closest('tr.rule-row');
      if (!row) return;
      open.has(row.dataset.rule) ? open.delete(row.dataset.rule) : open.add(row.dataset.rule);
      render();
    });
    table.addEventListener('keydown', (ev) => { const row = ev.target.closest('tr.rule-row'); if (row && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); row.click(); } });
    el.querySelectorAll('[data-sev]').forEach((b) => b.addEventListener('click', () => { const s = b.dataset.sev; state.sev.has(s) ? state.sev.delete(s) : state.sev.add(s); b.setAttribute('aria-pressed', state.sev.has(s)); render(); }));
    el.querySelector('[data-role="guarded"]').addEventListener('change', (ev) => { state.guarded = ev.target.checked; render(); });
    el.querySelector('[data-role="q"]').addEventListener('input', (ev) => { state.q = ev.target.value; render(); });
    render();
  }

  // ---------- comparison page
  const repoRef = (e) => !e || e.hidden ? esc(e ? e.name : '') : `<a href="#${esc(slug(e.name))}">${esc(e.name)}</a>`;
  function renderCompare(e, c) {
    const st = compareStatus(c);
    const oldE = byName(c.old_report), newE = byName(c.new_report);
    const api = c.api || {};
    const ovNew = (c.overrides || {}).new || [];
    const usage = c.usage || [];
    const lp = c.local_patches || { changed: [], diffs: {} };
    const parents = Object.entries(c.app_parents || {});
    const files = c.files || { added: [], removed: [] };
    let cmpTable = '';
    if (oldE && newE) {
      const a = analyse(latest(oldE)), b = analyse(latest(newE));
      const row = (label, x, y) => `<tr><td>${label}</td><td class="num">${x}</td><td class="num">${y}</td></tr>`;
      cmpTable = `<section><h3>${esc(T.cmpTable(target, oldE.name, newE.name))}</h3><p class="lead">${esc(T.cmpTableLead(target))}</p>
        <div class="table-scroll"><table><thead><tr><th></th><th class="num">${repoRef(oldE)}</th><th class="num">${repoRef(newE)}</th></tr></thead><tbody>
        ${row(pill('wajib'), a.counts.wajib, b.counts.wajib)}${row(pill('deprecated'), a.counts.deprecated, b.counts.deprecated)}${row(pill('perilaku'), a.counts.perilaku, b.counts.perilaku)}
        ${row(esc(T.parseErrRow), a.lintErr, b.lintErr)}${row(esc(T.compileDepRow), a.lintDep, b.lintDep)}${row(esc(T.deadRow(target)), a.guarded.wajib + a.guarded.deprecated, b.guarded.wajib + b.guarded.deprecated)}
        </tbody></table></div></section>`;
    }
    const diffHtml = (text) => `<pre class="diff">${esc(text).split('\n').map((l) => l.startsWith('+') && !l.startsWith('+++') ? `<span class="a">${l}</span>` : l.startsWith('-') && !l.startsWith('---') ? `<span class="d">${l}</span>` : l.startsWith('@@') ? `<span class="h">${l}</span>` : l).join('\n')}</pre>`;
    const mc = api.methods_changed || [];
    return `
      <div class="page-head"><h2>${esc(e.name)}</h2><span class="pill ${st[0]}">${esc(st[1])}</span></div>
      <p class="lead">${T.cmpLead(esc((c.old || {}).path), num((c.old || {}).files), esc((c.new || {}).path), num((c.new || {}).files), esc((c.app || {}).path))}</p>
      ${c.summary ? `<div class="summary"><p>${esc(c.summary)}</p></div>` : ''}
      <div class="stats">
        <div class="stat ${ovNew.length ? 'wajib' : 'ok'}"><span class="v">${ovNew.length}</span><span class="k">${esc(T.overrideConflicts)}</span></div>
        <div class="stat ${usage.length ? 'wajib' : 'ok'}"><span class="v">${usage.length}</span><span class="k">${esc(T.apiUsage)}</span></div>
        <div class="stat deprecated"><span class="v">${(lp.changed || []).length}</span><span class="k">${esc(T.localPatched)}</span></div>
        <div class="stat"><span class="v">${num(files.changed_count)}</span><span class="k">${esc(T.filesChanged(files.changed_count, (files.added || []).length, (files.removed || []).length))}</span></div>
      </div>
      ${(c.notes || []).length ? `<section><h3>${esc(T.analystNotes)}</h3>${notesHtml(c.notes)}</section>` : ''}
      ${cmpTable}
      <section><h3>${esc(T.localTitle)}</h3><p class="lead">${esc(T.localLead)}</p>
        ${(lp.changed || []).length ? lp.changed.map((f) => `<details class="block"><summary class="mono">${esc(f)}</summary><div>${diffHtml((lp.diffs || {})[f] || '')}</div></details>`).join('') : `<p class="empty">${esc(T.noLocal)}</p>`}</section>
      <section><h3>${esc(T.compatTitle)}</h3><p class="lead">${esc(T.compatLead)}</p>
        ${ovNew.length ? `<div class="table-scroll"><table><thead><tr><th>${esc(T.level)}</th><th>${esc(T.member)}</th><th>${esc(T.problem)}</th><th>${esc(T.signature)}</th></tr></thead><tbody>${ovNew.map((o) => `<tr><td>${pill(o.level === 'fatal' ? 'wajib' : 'perilaku', o.level)}</td><td class="mono">${esc(o.class)}::${esc(o.member || '')}<div class="sub">${esc(o.file)}:${o.line}</div></td><td>${esc(o.problem)}</td><td><div class="sig new">${esc(o.child || '')}</div><div class="sig old">${esc(o.parent || '')}</div></td></tr>`).join('')}</tbody></table></div>` : `<p class="empty">${esc(T.noConflict)}</p>`}
        ${parents.length ? `<p class="sub">${esc(T.perParent)} ${parents.map(([k, v]) => `<span class="tag mono">${esc(k)} × ${v}</span>`).join('')}</p>` : ''}</section>
      <section><h3>${esc(T.usageTitle)}</h3>
        ${usage.length ? `<div class="table-scroll"><table><thead><tr><th>${esc(T.loc)}</th><th>${esc(T.kind)}</th><th>${esc(T.api)}</th><th>${esc(T.call)}</th></tr></thead><tbody>${usage.map((u) => `<tr><td class="mono">${esc(u.file)}:${u.line}</td><td>${esc(u.kind)}</td><td class="mono">${esc(u.what)}</td><td class="mono">${esc(u.code)}</td></tr>`).join('')}</tbody></table></div>` : `<p class="empty">${esc(T.noUsage)}</p>`}</section>
      ${(c.config || []).length ? `<section><h3>${esc(T.config)}</h3><div class="table-scroll"><table><thead><tr><th>${esc(T.cfgFile)}</th><th>${esc(T.cfgNew)}</th><th>${esc(T.cfgUnused)}</th></tr></thead><tbody>${c.config.map((x) => `<tr><td class="mono">${esc(x.file)}</td><td>${(x.new_keys || []).map((k) => `<span class="tag mono">${esc(k)}</span>`).join('') || '-'}</td><td>${(x.unused_keys || []).map((k) => `<span class="tag mono">${esc(k)}</span>`).join('') || '-'}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
      <details class="block"><summary>${esc(T.sigChanged(mc.length))}</summary><div><div class="table-scroll"><table><thead><tr><th>${esc(T.methodCol)}</th><th>${esc(T.oldNew)}</th></tr></thead><tbody>
        ${mc.map((m) => `<tr><td class="mono">${esc(m.class)}::${esc(m.method)}()${m.more_required ? ' ' + pill('perilaku', T.moreReq) : ''}${m.return_added ? ' ' + pill('perilaku', T.retAdded) : ''}</td><td><div class="sig old">${esc(m.old)}</div><div class="sig new">${esc(m.new)}</div></td></tr>`).join('')}
      </tbody></table></div></div></details>
      <details class="block"><summary>${esc(T.removedTitle)}</summary><div>
        <p class="sub"><b>${esc(T.classes)}:</b> ${(api.classes_removed || []).map((x) => `<span class="tag mono">${esc(x.class)}</span>`).join('') || '-'}</p>
        <p class="sub"><b>${esc(T.methods)}:</b> ${(api.methods_removed || []).map((x) => `<span class="tag mono">${esc(x.class)}::${esc(x.method)}()</span>`).join('') || '-'}</p>
        <p class="sub"><b>${esc(T.functions)}:</b> ${(api.functions_removed || []).map((x) => `<span class="tag mono">${esc(x.function)}()</span>`).join('') || '-'}</p>
        <p class="sub"><b>${esc(T.funcChanged)}:</b> ${(api.functions_changed || []).map((x) => `<span class="tag mono">${esc(x.old)} → ${esc(x.new)}</span>`).join('') || '-'}</p></div></details>
      <details class="block"><summary>${esc(T.filesAddRem)}</summary><div>
        <p class="sub"><b>${esc(T.addedL)}:</b> ${(files.added || []).map((f) => `<span class="tag mono">${esc(f)}</span>`).join('') || '-'}</p>
        <p class="sub"><b>${esc(T.removedL)}:</b> ${(files.removed || []).map((f) => `<span class="tag mono">${esc(f)}</span>`).join('') || '-'}</p></div></details>`;
  }

  const kit = DATA.kit && DATA.kit.version ? ` · php-upgrade-audit ${DATA.kit.version}${DATA.kit.commit ? ' (' + DATA.kit.commit + ')' : ''}` : '';
  document.getElementById('footer').innerHTML = `<span>${esc(T.footer(DATA.redacted || 0))}</span><span class="sub">${esc(T.footerData + kit)}</span>`;
  show();
})();
</script>
